<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#07090e" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Squircle Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.08" />

  <!-- Center Core Glow -->
  <circle cx="256" cy="256" r="44" fill="#6366f1" opacity="0.25" filter="url(#glow)" />
  <circle cx="256" cy="256" r="32" fill="url(#ringGrad)" />

  <!-- Orbital Ring 1 -->
  <ellipse cx="256" cy="256" rx="160" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="8 6" transform="rotate(-30 256 256)" opacity="0.9" />

  <!-- Orbital Ring 2 -->
  <ellipse cx="256" cy="256" rx="160" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="8 6" transform="rotate(30 256 256)" opacity="0.9" />

  <!-- Orbital Ring 3 (Horizontal) -->
  <ellipse cx="256" cy="256" rx="160" ry="64" fill="none" stroke="url(#ringGrad)" stroke-width="12" stroke-dasharray="8 6" transform="rotate(90 256 256)" opacity="0.85" />

  <!-- Satellite Electron Dots -->
  <circle cx="394" cy="176" r="10" fill="#06b6d4" filter="url(#glow)" />
  <circle cx="118" cy="336" r="10" fill="#8b5cf6" filter="url(#glow)" />
  <circle cx="256" cy="96" r="10" fill="#10b981" filter="url(#glow)" />
</svg>
